<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffd60a" />
  <title>Para vos 🩶</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩶</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=21" />
</head>
<body>

  <canvas id="love-canvas" aria-hidden="true"></canvas>
  <div class="skywash" id="skywash" aria-hidden="true"></div>
  <div class="gold-dust" aria-hidden="true"></div>

  <div class="ambient" id="ambient" aria-hidden="true"></div>

  <!-- ============ LANDING / CANDADOS ============ -->
  <main id="view-landing" class="view active">
    <div class="landing-bg" aria-hidden="true">
      <div class="landing-glow landing-glow--a"></div>
      <div class="landing-glow landing-glow--b"></div>
      <div class="landing-rays"></div>
      <div id="landing-stars"></div>
    </div>

    <div class="landing-hero">
      <div class="hero-badge"><span class="hero-emoji">🩶</span></div>
      <h1 class="hero-title">Nuestras Fechas</h1>
      <p class="hero-sub" id="hero-sub">Tres regalos, tres momentos, una sola persona: vos.</p>
      <div class="hero-date" id="hero-date"></div>
    </div>

    <div class="cards" id="unlock-cards">
      <button class="unlock-card card-galaxy" data-view="galaxy" data-key="galaxy" aria-label="Sección galaxia">
        <span class="card-orbit" aria-hidden="true"></span>
        <span class="card-icon"><span class="card-emoji">🌼</span></span>
        <span class="card-txt">
          <span class="card-title">Flores Amarillas</span>
          <span class="card-sub">21 de septiembre</span>
        </span>
        <span class="card-lock"><span class="lock-badge"><span class="lock-icon">🔒</span></span><span class="countdown"></span></span>
        <span class="card-shine" aria-hidden="true"></span>
      </button>

      <button class="unlock-card card-letter" data-view="letter" data-key="letter" aria-label="Sección amor y amistad">
        <span class="card-orbit" aria-hidden="true"></span>
        <span class="card-icon"><span class="card-emoji">💌</span></span>
        <span class="card-txt">
          <span class="card-title">Amor y Amistad</span>
          <span class="card-sub">19 de septiembre</span>
        </span>
        <span class="card-lock"><span class="lock-badge"><span class="lock-icon">🔒</span></span><span class="countdown"></span></span>
        <span class="card-shine" aria-hidden="true"></span>
      </button>

      <button class="unlock-card card-timeline" data-view="timeline" data-key="timeline" aria-label="Sección nustro mes">
        <span class="card-orbit" aria-hidden="true"></span>
        <span class="card-icon"><span class="card-emoji">🩶</span></span>
        <span class="card-txt">
          <span class="card-title">Nuestro Mes</span>
          <span class="card-sub">22 de septiembre</span>
        </span>
        <span class="card-lock"><span class="lock-badge"><span class="lock-icon">🔒</span></span><span class="countdown"></span></span>
        <span class="card-shine" aria-hidden="true"></span>
      </button>
    </div>

    <p class="landing-foot">Hecho con todo el corazón, para la dueña de mis días.</p>
  </main>

  <!-- ============ SECCIÓN 1: GALAXIA ============ -->
  <section id="view-galaxy" class="view">
    <header class="sec-head">
      <button class="nav-back" data-back="landing" aria-label="Volver">←</button>
      <div>
        <h2 id="galaxy-title">Flores Amarillas</h2>
        <p class="sec-sub" id="galaxy-subtitle"></p>
      </div>
    </header>

    <div class="galaxy-stage" id="galaxy-stage">
      <div class="galaxy-glow"></div>
      <div id="galaxy-stars"></div>
      <div id="galaxy-rays" aria-hidden="true"></div>
      <canvas id="galaxy-canvas" aria-hidden="true"></canvas>
      <div id="galaxy-flower" aria-hidden="true"></div>
      <div id="galaxy-dust" aria-hidden="true"></div>
      <div id="galaxy-skyfx" aria-hidden="true"></div>
      <div id="galaxy-petals"></div>
      <div id="galaxy-shooting" aria-hidden="true"></div>
      <div class="galaxy-heart" id="galaxy-heart" aria-hidden="true"></div>
      <div id="galaxy-photos"></div>
      <div class="galaxy-messages" id="galaxy-messages" aria-hidden="true"></div>
      <div class="galaxy-hint">Tocá una foto o un mensaje para conocer mi mundo</div>

      <div class="galaxy-final" id="galaxy-final" hidden>
        <span class="galaxy-final-heart" aria-hidden="true">🩶</span>
        <p class="galaxy-final-line" id="galaxy-final-line"></p>
      </div>
    </div>

    <p class="galaxy-intro" id="galaxy-intro"></p>

    <!-- Foto ampliada -->
    <div id="photo-lightbox" class="lightbox" aria-hidden="true">
      <div class="lightbox-card">
        <div class="lightbox-img-wrap"><img id="lightbox-img" src="" alt="Nuestra foto" /></div>
        <p class="lightbox-caption" id="lightbox-caption"></p>
        <button class="lightbox-close" id="lightbox-close" aria-label="Cerrar">✕</button>
      </div>
    </div>
  </section>

  <!-- ============ SECCIÓN 2: AMOR Y AMISTAD ============ -->
  <section id="view-letter" class="view">
    <header class="sec-head">
      <button class="nav-back" data-back="landing" aria-label="Volver">←</button>
      <div>
        <h2 id="letter-title">Amor y Amistad</h2>
        <p class="sec-sub" id="letter-subtitle"></p>
      </div>
    </header>

    <div class="love-stage" id="love-stage">
      <div class="love-aura" aria-hidden="true"></div>
      <canvas id="love-canvas" class="love-canvas" aria-hidden="true"></canvas>
      <div class="love-core" id="love-core" aria-hidden="true"></div>
      <div id="love-galaxies" aria-hidden="true"></div>
      <div id="love-embers" class="love-embers" aria-hidden="true"></div>
      <div id="love-beats" class="love-beats" aria-hidden="true"></div>
      <div class="love-zones" id="love-zones" aria-hidden="true"></div>
      <div class="love-messages" id="love-messages" aria-hidden="true"></div>
      <p class="love-kicker" id="love-kicker"></p>
      <div class="love-final" id="love-final" hidden>
        <span class="love-heart-final" aria-hidden="true">🩶</span>
        <p class="love-final-line" id="love-final-line"></p>
        <button id="open-letter-btn" class="open-letter-btn">Abrir carta 💌</button>
      </div>
      <div class="love-flash" id="love-flash" aria-hidden="true"></div>
    </div>

    <div class="letter-overlay" id="letter-overlay" hidden>
      <button class="letter-close" id="letter-close" aria-label="Cerrar carta">✕</button>

      <div class="env-scene" id="env-scene">
        <div class="envelope" id="envelope" aria-hidden="true">
          <div class="letter-card" id="letter-card">
            <h3 class="letter-title" id="letter-paper-title"></h3>
            <div class="letter-body" id="letter-body"></div>
          </div>
        </div>
      </div>

      <button id="love-replay" class="love-replay" hidden>↺ Viajar de nuevo</button>
    </div>
  </section>

  <!-- ============ SECCIÓN 3: NUESTRO MES ============ -->
  <section id="view-timeline" class="view">
    <header class="sec-head">
      <button class="nav-back" data-back="landing" aria-label="Volver">←</button>
      <div>
        <h2 id="timeline-title">Nuestro Mes</h2>
        <p class="sec-sub" id="timeline-subtitle"></p>
      </div>
    </header>

    <!-- Fondo decorativo alrededor del celular -->
    <div class="month-bg" aria-hidden="true">
      <div class="month-halo"></div>
      <div class="month-nebula month-nebula--a"></div>
      <div class="month-nebula month-nebula--b"></div>
      <div id="month-stars"></div>
      <div id="month-floats"></div>
    </div>

    <!-- Celular con pantalla de bloqueo y contador -->
    <div class="month-phone" id="month-phone">
      <div class="phone-screen phone-lock" id="phone-lock">
        <div class="phone-status">
          <span id="phone-time">--:--</span>
        </div>

        <p class="phone-lock-title" id="phone-lock-title"></p>
        <p class="phone-lock-hint" id="phone-lock-hint"></p>

        <div class="pin-dots" id="pin-dots" aria-hidden="true"></div>

        <div class="keypad" id="keypad"></div>
      </div>

      <div class="phone-screen phone-counter" id="phone-counter" hidden>
        <div class="phone-status"><span id="phone-time-2">--:--</span></div>

        <div class="counter-hero">
          <span class="counter-months" id="mc-months">0</span>
          <span class="counter-months-label" id="mc-months-label">meses</span>
        </div>

        <div class="counter-detail">
          <div class="cd-block"><b id="mc-years">0</b><span>años</span></div>
          <div class="cd-block"><b id="mc-days">0</b><span>días</span></div>
          <div class="cd-block"><b id="mc-hours">0</b><span>hs</span></div>
          <div class="cd-block"><b id="mc-minutes">0</b><span>min</span></div>
          <div class="cd-block"><b id="mc-seconds">0</b><span>seg</span></div>
        </div>

        <div class="month-actions">
          <button class="month-action" id="month-letter-btn">Leer carta 💌</button>
          <button class="month-action" id="month-memories-btn">Ver recuerdos 🩶</button>
        </div>
      </div>
    </div>

    <!-- Carta de nuestro mes -->
    <div class="month-overlay" id="month-letter-overlay" hidden>
      <button class="month-close" id="month-letter-close" aria-label="Cerrar carta">✕</button>
      <div class="month-letter">
        <span class="month-letter-emoji" aria-hidden="true">💌</span>
        <h3 class="month-letter-title" id="month-letter-title"></h3>
        <div class="month-letter-body" id="month-letter-body"></div>
        <p class="month-letter-sign" id="month-letter-sign"></p>
      </div>
    </div>

    <!-- Recuerdos de nuestro mes -->
    <div class="month-overlay" id="month-memories-overlay" hidden>
      <button class="month-close" id="month-memories-close" aria-label="Cerrar recuerdos">✕</button>
      <div class="month-memories">
        <h3 class="month-memories-title" id="month-memories-title"></h3>
        <p class="month-memories-sub" id="month-memories-sub"></p>
        <div class="memories-list" id="memories-list"></div>
        <p class="month-epilogue" id="month-epilogue"></p>
        <button class="month-forever" id="month-forever-btn">Quedate para siempre 🩶</button>
      </div>
    </div>
  </section>

  <div id="confetti-layer" class="confetti-layer" aria-hidden="true"></div>

  <button id="music-btn" class="music-btn" aria-label="Reproducir nuestra canción" hidden>♪</button>
  <audio id="music-audio" loop preload="none"></audio>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js" defer></script>
  <script src="config.js?v=11"></script>
  <script src="script.js?v=20"></script>
</body>
</html>
